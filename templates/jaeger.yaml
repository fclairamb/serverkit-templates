id: jaeger
name: Jaeger
version: "1.52"
description: Open-source distributed tracing system for monitoring and troubleshooting microservices
icon: https://serverkit.ai/imgs/template-icons/jaeger.png
website: https://www.jaegertracing.io
documentation: https://www.jaegertracing.io/docs/
categories:
  - monitoring
  - tracing
  - observability

variables:
  - name: UI_PORT
    description: Web UI port
    type: port
    default: "16686"
    hidden: true
  - name: COLLECTOR_PORT
    description: Collector port for spans
    type: port
    default: "14268"
    hidden: true

# What the OpenTelemetry Collector gets through `fromService` (Attach → Traces
# on the collector), over the shared service network. Jaeger accepts OTLP on
# 4317/4318 by default.
connection:
  port: 4317
  properties:
    otlpGrpc: "{host}:4317"
    url: "http://{host}:16686"

ports:
  - port: 16686
    protocol: tcp
    description: Web UI
  - port: 14268
    protocol: tcp
    description: HTTP collector
  - port: 6831
    protocol: udp
    description: Thrift compact protocol

volumes:
  - name: data
    path: /badger
    description: Badger storage for traces

requirements:
  memory: 1GB
  storage: 5GB

compose:
  services:
    jaeger:
      image: jaegertracing/all-in-one:${VERSION:-1.52}
      container_name: ${APP_NAME}
      restart: unless-stopped
      # The image runs as an unprivileged user, and a fresh named volume at
      # /badger is root-owned, so badger could not create its key/data
      # directories and Jaeger exited at start ("mkdir /badger/key:
      # permission denied"). The volume is private to this container.
      user: "0"
      environment:
        - SPAN_STORAGE_TYPE=badger
        - BADGER_EPHEMERAL=false
        - BADGER_DIRECTORY_VALUE=/badger/data
        - BADGER_DIRECTORY_KEY=/badger/key
      volumes:
        - jaeger_data:/badger
      ports:
        - "${UI_PORT}:16686"
        - "${COLLECTOR_PORT}:14268"
        - "6831:6831/udp"

  volumes:
    jaeger_data:
